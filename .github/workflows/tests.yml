name: Smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - run: python -m pytest -m smoke --run_headless --reruns 1 --html=report.html --self-contained-html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: report.html